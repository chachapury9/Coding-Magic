<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Magic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Sacramento&display=swap"
      rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <div class="logo">
          <svg class="icon"></svg>
          <h1 class="top-logo">Coding</h1>
          <p class="sub-logo">Magic</p>
        </div>
        <ul class="nav-list">
          <li class="nav-item"><a href="" class="nav-link">Інтерактив</a></li>
          <li class="nav-item"><a href="" class="nav-link">Наша команда</a></li>
          <li class="nav-item"><a href="" class="nav-link">Контакти</a></li>
        </ul>
        <ul class="nav-user-pref">
          <li class="nav-pref"><button id="themeSwitch"></button></li>
          <li class="nav-pref">
            <p>Вітаємо, <span id="username"></span>!</p>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="site-title">Популярні інетрактивні ігри</h1>
      <section class="container intercalary-year-check">
        <hr />
        <br />
        <h3 class="title">Перевір в який рік ти народився</h3>

        <div class="iyc-wrapper">
          <form action="" class="intercalary-form">
            <input type="text" name="" id="iyc-input" />
            <button type="submit" id="iyc-btn">
              <svg class="iyc-svg">
                <use href="./images/Group 104.svg"></use>
              </svg>
            </button>
          </form>
          <p id="iyc-conclusion"></p>
        </div>
      </section>

      <section class="container number-guesser">
        <hr />
        <br />
      </section>

      <section class="container rock-paper-scissors">
        <hr />
        <br />
        <h2 class="title">Камінь - ножиці - папір</h2>
        <div class="rps-wrapper">
          <ul class="rps-options">
            <li class="rps-option">
              <button class="rps-btn" id="rock">
                <svg class="rps-svg"><use href="./images/stone.svg"></use></svg>
              </button>
            </li>
            <li class="rps-option">
              <button class="rps-btn" id="scissors">
                <svg class="rps-svg">
                  <use href="./images/scissors.svg"></use>
                </svg>
              </button>
            </li>
            <li class="rps-option">
              <button class="rps-btn" id="paper">
                <svg class="rps-svg"><use href="./images/paper.svg"></use></svg>
              </button>
            </li>
          </ul>
          <ul class="rps-scoretab">
            <li class="rps-score-item"><p class="rps-score">Рахунок:</p></li>
            <li class="rps-score-item">
              <p class="rps-score" id="rps-score">
                Комп'тер - <span id="ai-score"></span>
              </p>
            </li>
            <li class="rps-score-item">
              <p class="rps-score" id="rps-score">
                Ви - <span id="user-score"></span>
              </p>
            </li>
          </ul>
        </div>

        <p id="rpsConclusion"></p>
        <p class="rps-ai-choice">Варіант комп’ютера</p>
      </section>
      <section class="container calculator">
        <hr />
        <br />
        <h3 class="title">Калькулятор</h3>
        <div class="calculator-wrap">
          <input type="text" id="numb1" placeholder="Введіть число" />
          <ul class="operators">
            <li class="operator-item">
              <button class="operator-btn" id="plus">+</button>
            </li>
            <li class="operator-item">
              <button class="operator-btn" id="multiply-by">*</button>
            </li>
            <li class="operator-item">
              <button class="operator-btn" id="minus">-</button>
            </li>
            <li class="operator-item">
              <button class="operator-btn" id="devide-by">/</button>
            </li>
          </ul>
          <input type="text" id="numb2" placeholder="Введіть число" />
          <p class="equals">=</p>
          <p id="calculation-result">Результат</p>
        </div>
      </section>
      <section class="container team-slider">
        <hr />
        <br />
        <h3 class="title">Наша команда</h3>
        <div class="team-slider-wrapper">
          <button id="team-left" class="team-btn">
            <svg class="team-svg">
              <use href="./images/Vector 231.svg"></use>
            </svg>
          </button>
          <div class="slider">
            <img src="" alt="" id="team-img" />
            <p id="team-name"></p>
            <p id="team-desc"></p>
          </div>
          <button id="team-right" class="team-btn">
            <svg class="team-svg">
              <use href="./images/Vector 230.svg"></use>
            </svg>
          </button>
        </div>
      </section>

      <section class="container google-dino">
        <hr />
        <br />
        <h3 class="title">Google динозавр</h3>
        <div class="google-dino-wrapper">
          <button id="google-dino-restart" class="hide">
            <img src="./images/google-dino/restart.png" alt="" />
          </button>
          <canvas id="canvas" width="700" height="300"></canvas>
        </div>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="./js/intercalary.js"></script>
    <script type="module" src="./js/rock-paper-scissors.js"></script>
    <script type="module" src="./js/calculator.js"></script>
    <script type="module" src="./js/slider.js"></script>
    <script type="module" src="./js/google-dino.js"></script>
  </body>
</html>

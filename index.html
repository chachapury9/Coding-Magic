<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Magic</title>
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <div class="logo">
          <svg class="icon"></svg>
          <h1 class="top-logo">Coding</h1>
          <p class="sub-logo">Magic</p>
        </div>
        <ul class="nav-list">
          <li class="nav-item"><a href="" class="nav-link">Інтерактив</a></li>
          <li class="nav-item"><a href="" class="nav-link">Наша команда</a></li>
          <li class="nav-item"><a href="" class="nav-link">Контакти</a></li>
        </ul>
        <ul class="nav-user-pref">
          <li class="nav-pref"><button id="themeSwitch"></button></li>
          <li class="nav-pref">
            <p>Вітаємо, <span id="username"></span>!</p>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h2 class="site-title">Популярні інтерактивні ігри</h2>
      <br />
      <section class="intercalary-year-check">
        <h3 class="title">Перевір в який рік ти народився</h3>
        <form action="">
          <input type="text" name="" id="iyc-input" />
          <button type="submit" id="iyc-btn"><svg></svg></button>
        </form>
        <p class="iyc-conclusion"></p>
      </section>
      <section class="word-guesser"></section>
      <section class="rock-paper-scissors">
        <h2 class="title">Камінь - ножиці - папір</h2>
        <ul class="rps-options">
          <li class="rps-option" id="rock">
            <button><svg></svg></button>
          </li>
          <li class="rps-option" id="scissors">
            <button><svg></svg></button>
          </li>
          <li class="rps-option" id="paper">
            <button><svg></svg></button>
          </li>
        </ul>
        <p class="rps-conclusion"></p>
        <p class="rps-ai-choice"></p>
        <ul class="rps-scoretab">
          <li class="rps-score-item"><p class="rps-score">Рахунок:</p></li>
          <li class="rps-score-item">
            <p class="rps-score" id="rps-score">
              Комп'тер - <span id="ai-score"></span>
            </p>
          </li>
          <li class="rps-score-item">
            <p class="rps-score" id="rps-score">
              Ви - <span id="user-score"></span>
            </p>
          </li>
        </ul>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="./js/intercalary.js"></script>
    <script type="module" src="./js/rock-paper-scissors.js"></script>
  </body>
</html>
